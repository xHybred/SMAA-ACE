<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">SMAA-ACE: SMAA 1x with Active Compaction of Edges</title>
  <desc id="heroDesc">A dark banner with the title SMAA-ACE, two magnified pixel grids comparing an aliased edge with an SMAA-blended edge, and the measured 4K result of 0.169 milliseconds versus 0.352 milliseconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101c"/>
      <stop offset="0.55" stop-color="#0e1728"/>
      <stop offset="1" stop-color="#111f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6be"/>
      <stop offset="1" stop-color="#4dabf7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21324a" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#grid)" opacity="0.42"/>
  <circle cx="1040" cy="92" r="130" fill="#4dabf7" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="880" cy="330" r="110" fill="#63e6be" opacity="0.08" filter="url(#softGlow)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="72" y="70" fill="#7f93ad" font-size="17" font-weight="600" letter-spacing="4.2">ACTIVE COMPACTION OF EDGES</text>

    <text x="68" y="162" fill="#f4f8fc" font-size="76" font-weight="800" letter-spacing="-2">SMAA<tspan fill="#63e6be">-ACE</tspan></text>
    <text x="72" y="202" fill="#c3d1e2" font-size="24" font-weight="400">SMAA 1x with Active Compaction of Edges</text>
    <text x="72" y="232" fill="#8296af" font-size="17">HLSL for D3D12, Vulkan, and SM5/DXBC.</text>

    <line x1="72" y1="262" x2="646" y2="262" stroke="#243650" stroke-width="1"/>

    <text x="72" y="310" fill="#63e6be" font-size="34" font-weight="700">0.169 ms</text>
    <text x="72" y="334" fill="#7f93ad" font-size="14" letter-spacing="0.6">SMAA-ACE · 3840x2160</text>

    <text x="270" y="310" fill="#dbe7f4" font-size="34" font-weight="700">0.352 ms</text>
    <text x="270" y="334" fill="#7f93ad" font-size="14" letter-spacing="0.6">ORIGINAL 2013 PATH</text>

    <text x="470" y="310" fill="#f4f8fc" font-size="34" font-weight="700">52%</text>
    <text x="470" y="334" fill="#7f93ad" font-size="14" letter-spacing="0.6">LOWER TOTAL TIME</text>
  </g>

  <g transform="translate(744 96)">
    <rect x="-24" y="-28" width="404" height="266" rx="20" fill="#0b1524" stroke="#233650" stroke-width="1"/>

    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" letter-spacing="1.2">
      <text x="16" y="18" fill="#6e8099">EDGE COVERAGE</text>
      <text x="84" y="190" fill="#6e8099" text-anchor="middle">ALIASED</text>
      <text x="300" y="190" fill="#63e6be" text-anchor="middle">SMAA 1x</text>
    </g>

    <!-- Aliased pixels: hard diagonal boundary. -->
    <g fill="#101d2e">
      <rect x="16" y="34" width="136" height="136" rx="3"/>
    </g>
    <g fill="#1e5b53">
      <path d="M33 34H152V49H33Z M50 51H152V66H50Z M67 68H152V83H67Z M84 85H152V100H84Z M101 102H152V117H101Z M118 119H152V134H118Z M135 136H152V151H135Z"/>
      <rect x="16" y="34" width="15" height="15" rx="2"/>
      <rect x="33" y="51" width="15" height="15" rx="2"/>
      <rect x="50" y="68" width="15" height="15" rx="2"/>
      <rect x="67" y="85" width="15" height="15" rx="2"/>
      <rect x="84" y="102" width="15" height="15" rx="2"/>
      <rect x="101" y="119" width="15" height="15" rx="2"/>
      <rect x="118" y="136" width="15" height="15" rx="2"/>
      <rect x="135" y="153" width="15" height="15" rx="2"/>
    </g>
    <g fill="#63e6be">
      <rect x="16" y="34" width="15" height="15" rx="2"/>
      <rect x="33" y="51" width="15" height="15" rx="2"/>
      <rect x="50" y="68" width="15" height="15" rx="2"/>
      <rect x="67" y="85" width="15" height="15" rx="2"/>
      <rect x="84" y="102" width="15" height="15" rx="2"/>
      <rect x="101" y="119" width="15" height="15" rx="2"/>
      <rect x="118" y="136" width="15" height="15" rx="2"/>
      <rect x="135" y="153" width="15" height="15" rx="2"/>
    </g>
    <g fill="none" stroke="#1e3854" stroke-width="1">
      <rect x="16" y="34" width="136" height="136" rx="3"/>
    </g>

    <line x1="166" y1="102" x2="218" y2="102" stroke="#4f6580" stroke-width="2"/>
    <path d="M218 96L228 102L218 108Z" fill="#4f6580"/>

    <!-- SMAA pixels: partial coverage along the same boundary. -->
    <g fill="#101d2e">
      <rect x="232" y="34" width="136" height="136" rx="3"/>
    </g>
    <g fill="#1e5b53">
      <path d="M249 34H368V49H249Z M266 51H368V66H266Z M283 68H368V83H283Z M300 85H368V100H300Z M317 102H368V117H317Z M334 119H368V134H334Z M351 136H368V151H351Z"/>
    </g>
    <g fill="#63e6be" fill-opacity="0.18">
      <rect x="232" y="51" width="15" height="15" rx="2"/>
      <rect x="249" y="68" width="15" height="15" rx="2"/>
      <rect x="266" y="85" width="15" height="15" rx="2"/>
      <rect x="283" y="102" width="15" height="15" rx="2"/>
      <rect x="300" y="119" width="15" height="15" rx="2"/>
      <rect x="317" y="136" width="15" height="15" rx="2"/>
      <rect x="334" y="153" width="15" height="15" rx="2"/>
    </g>
    <g fill="#63e6be" fill-opacity="0.55">
      <rect x="232" y="34" width="15" height="15" rx="2"/>
      <rect x="249" y="51" width="15" height="15" rx="2"/>
      <rect x="266" y="68" width="15" height="15" rx="2"/>
      <rect x="283" y="85" width="15" height="15" rx="2"/>
      <rect x="300" y="102" width="15" height="15" rx="2"/>
      <rect x="317" y="119" width="15" height="15" rx="2"/>
      <rect x="334" y="136" width="15" height="15" rx="2"/>
      <rect x="351" y="153" width="15" height="15" rx="2"/>
    </g>
    <g fill="none" stroke="#1e3854" stroke-width="1">
      <rect x="232" y="34" width="136" height="136" rx="3"/>
    </g>

    <text x="16" y="212" fill="#53657c" stroke="none" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Magnified pixels. SMAA blends edge coverage;</text>
    <text x="16" y="228" fill="#53657c" stroke="none" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">it does not vectorize the edge.</text>
  </g>
</svg>
