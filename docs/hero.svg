<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">SMAA 1x compute-optimized HLSL</title>
  <desc id="heroDesc">A dark banner with the title SMAA 1x, a stair-step edge resolving into a smooth line, and the measured 4K result of 0.169 milliseconds versus 0.352 milliseconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101c"/>
      <stop offset="0.55" stop-color="#0e1728"/>
      <stop offset="1" stop-color="#111f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6be"/>
      <stop offset="1" stop-color="#4dabf7"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44546c"/>
      <stop offset="0.55" stop-color="#7d8fa8"/>
      <stop offset="1" stop-color="#63e6be"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21324a" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#grid)" opacity="0.42"/>
  <circle cx="1040" cy="92" r="130" fill="#4dabf7" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="880" cy="330" r="110" fill="#63e6be" opacity="0.08" filter="url(#softGlow)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="72" y="86" fill="#7f93ad" font-size="17" font-weight="600" letter-spacing="4.2">COMPUTE-OPTIMIZED ANTIALIASING</text>

    <text x="68" y="182" fill="#f4f8fc" font-size="78" font-weight="800" letter-spacing="-2">SMAA <tspan fill="#63e6be">1x</tspan></text>
    <text x="72" y="226" fill="#c3d1e2" font-size="25" font-weight="400">Standalone HLSL for D3D12 and Vulkan</text>
    <text x="72" y="262" fill="#8296af" font-size="17">Reference SMAA 1x quality with compacted edge work.</text>

    <line x1="72" y1="300" x2="646" y2="300" stroke="#243650" stroke-width="1"/>

    <text x="72" y="338" fill="#63e6be" font-size="34" font-weight="700">0.169 ms</text>
    <text x="72" y="362" fill="#7f93ad" font-size="14" letter-spacing="0.6">OPTIMIZED · 3840x2160</text>

    <text x="270" y="338" fill="#dbe7f4" font-size="34" font-weight="700">0.352 ms</text>
    <text x="270" y="362" fill="#7f93ad" font-size="14" letter-spacing="0.6">ORIGINAL 2013 PATH</text>

    <text x="470" y="338" fill="#f4f8fc" font-size="34" font-weight="700">52%</text>
    <text x="470" y="362" fill="#7f93ad" font-size="14" letter-spacing="0.6">LOWER TOTAL TIME</text>
  </g>

  <g transform="translate(744 96)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-30" y="-28" width="404" height="260" rx="20" fill="#0b1524" stroke="#233650" stroke-width="1"/>

    <g stroke="#45566e" stroke-width="12">
      <path d="M16 176H52V148H88V120H124V92H160V64H196"/>
    </g>
    <path d="M196 64C244 64 258 32 316 32" stroke="url(#fade)" stroke-width="12"/>
    <path d="M196 64C244 64 258 32 316 32" stroke="#63e6be" stroke-width="4" opacity="0.85"/>

    <circle cx="316" cy="32" r="7" fill="#63e6be" stroke="none"/>
    <circle cx="16" cy="176" r="5" fill="#7d8fa8" stroke="none"/>

    <text x="16" y="214" fill="#6e8099" stroke="none" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" letter-spacing="1.4">RAW EDGE</text>
    <text x="248" y="214" fill="#63e6be" stroke="none" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" letter-spacing="1.4">RESOLVED</text>

    <text x="16" y="238" fill="#53657c" stroke="none" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">SMAA 1x · color-only detection</text>
  </g>
</svg>
